server {
    listen 3000;
    server_name localhost;

    # Customer Portal
    location /portal {
        root /usr/share/nginx/html;
        try_files $uri $uri/ /portal.html;
    }

    location = /portal.html {
        root /usr/share/nginx/html;
        add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate, max-age=0";
        add_header Pragma "no-cache";
        add_header Expires "0";
        expires -1;
        etag off;
        if_modified_since off;
    }

    # Teknisi Portal
    location /teknisi {
        root /usr/share/nginx/html;
        try_files $uri $uri/ /teknisi.html;
    }

    location = /teknisi.html {
        root /usr/share/nginx/html;
        add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate, max-age=0";
        add_header Pragma "no-cache";
        add_header Expires "0";
        expires -1;
        etag off;
        if_modified_since off;
    }

    # Kolektor Portal
    location /kolektor {
        root /usr/share/nginx/html;
        try_files $uri $uri/ /kolektor.html;
    }

    location = /kolektor.html {
        root /usr/share/nginx/html;
        add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate, max-age=0";
        add_header Pragma "no-cache";
        add_header Expires "0";
        expires -1;
        etag off;
        if_modified_since off;
    }

    location / {
        root /usr/share/nginx/html;
        index index.html index.htm;
        # Menangani React Router (SPA) - Kirim semua ke index.html jika tidak ada file fisik
        try_files $uri $uri/ /index.html;
    }

    # Pastikan index.html tidak dicache agar update segera terlihat
    location = /index.html {
        root /usr/share/nginx/html;
        add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate, max-age=0";
        add_header Pragma "no-cache";
        add_header Expires "0";
        expires -1;
        # Disable ETag untuk force reload
        etag off;
        if_modified_since off;
    }

    # Cache untuk static assets (JS, CSS, images) dengan versioning
    # Vite otomatis generate hash di filename, jadi aman di-cache lama
    # Tapi tetap respect query string untuk force reload
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        root /usr/share/nginx/html;
        expires 1y;
        add_header Cache-Control "public, immutable";
        # Tapi kalau ada query string ?v=xxx, jangan cache
        if ($args ~* "v=") {
            add_header Cache-Control "no-cache";
            expires -1;
        }
    }

    # Proksi semua panggilan API ke backend container (menggunakan trailing slash agar mapping URL tepat)
    location /api/ {
        proxy_pass http://127.0.0.1:5001/api/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
    }

    error_page 500 502 503 504 /50x.html;
    location = /50x.html {
        root /usr/share/nginx/html;
    }
}
