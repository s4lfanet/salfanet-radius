server {
    listen 80;
    server_name home.pmynet.id;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name home.pmynet.id;

    # SSL - isi path sesuai sertifikat dari aaPanel / Let's Encrypt
    ssl_certificate     /www/server/panel/vhost/cert/home.pmynet.id/fullchain.pem;
    ssl_certificate_key /www/server/panel/vhost/cert/home.pmynet.id/privkey.pem;

    # Frontend — sajikan dari dist
    root /www/wwwroot/pmyhome/frontend/dist;
    index index.html;

    # Semua route React → index.html (SPA)
    location / {
        try_files $uri $uri/ /index.html;
    }

    # API → backend Docker (port 5001)
    location /api/ {
        proxy_pass http://127.0.0.1:5002;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_cache_bypass $http_upgrade;
        proxy_read_timeout 60s;
    }

    # Upload file (ukuran maksimal)
    client_max_body_size 20M;

    # Cache aset statis
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff2?)$ {
        expires 30d;
        add_header Cache-Control "public, no-transform";
    }
}
