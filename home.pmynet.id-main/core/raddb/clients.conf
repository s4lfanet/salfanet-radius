# Client localhost untuk testing
client localhost {
    ipaddr = 127.0.0.1
    secret = testing123
    require_message_authenticator = no
}

# Client Docker Network
client docker_network {
    ipaddr = 172.30.0.0/24
    secret = testing123
    require_message_authenticator = no
}

# Semua NAS/Router mitra PMYNET
# Menerima semua IP dengan shared secret yang benar
# Secret diverifikasi per-request — tidak ada router lain yang bisa masuk tanpa secret ini
client all_nas {
    ipaddr = 0.0.0.0/0
    secret = Mynet@2026
    require_message_authenticator = no
    nas_type = other
}
