# -*- text -*-
#
#  ippool/mysql/queries.conf -- MySQL queries for rlm_sqlippool
#  Configured for Salfanet using stored procedure
#

skip_locked = ""

# Use stored procedure for atomic allocation
allocate_begin = ""
allocate_find = "\
	CALL fr_allocate_previous_or_new_framedipaddress( \
		'%{control:${pool_name}}', \
		'%{User-Name}', \
		'%{Calling-Station-Id}', \
		'%{Called-Station-Id}', \
		'%{NAS-IP-Address}', \
		'${pool_key}', \
		${lease_duration} \
	)"
allocate_update = ""
allocate_commit = ""

pool_check = "\
	SELECT id \
	FROM ${ippool_table} \
	WHERE pool_name='%{control:${pool_name}}' \
	LIMIT 1"

# Accounting START - extend lease
start_update = "\
	UPDATE ${ippool_table} \
	SET \
		expiry_time = NOW() + INTERVAL ${lease_duration} SECOND \
	WHERE nasipaddress = '%{NAS-IP-Address}' \
	AND pool_key = '${pool_key}' \
	AND username = '%{User-Name}' \
	AND callingstationid = '%{Calling-Station-Id}' \
	AND framedipaddress = '%{${attribute_name}}'"

# Accounting STOP - release IP back to pool
stop_clear = "\
	UPDATE ${ippool_table} \
	SET \
		expiry_time = NOW(), \
		username = '', \
		callingstationid = '', \
		nasipaddress = '', \
		pool_key = '' \
	WHERE nasipaddress = '%{%{Nas-IP-Address}:-%{Nas-IPv6-Address}}' \
	AND pool_key = '${pool_key}' \
	AND username = '%{User-Name}' \
	AND callingstationid = '%{Calling-Station-Id}' \
	AND framedipaddress = '%{${attribute_name}}'"

# Accounting ALIVE - extend lease
alive_update = "\
	UPDATE ${ippool_table} \
	SET \
		expiry_time = NOW() + INTERVAL ${lease_duration} SECOND \
	WHERE nasipaddress = '%{%{Nas-IP-Address}:-%{Nas-IPv6-Address}}' \
	AND pool_key = '${pool_key}' \
	AND username = '%{User-Name}' \
	AND callingstationid = '%{Calling-Station-Id}' \
	AND framedipaddress = '%{${attribute_name}}'"

# Accounting ON
on_clear = "\
	UPDATE ${ippool_table} \
	SET \
		expiry_time = NOW(), \
		username = '', \
		callingstationid = '', \
		pool_key = '' \
	WHERE nasipaddress = '%{%{Nas-IP-Address}:-%{Nas-IPv6-Address}}'"

# Accounting OFF
off_clear = "\
	UPDATE ${ippool_table} \
	SET \
		expiry_time = NOW(), \
		username = '', \
		callingstationid = '', \
		pool_key = '' \
	WHERE nasipaddress = '%{%{Nas-IP-Address}:-%{Nas-IPv6-Address}}'"
