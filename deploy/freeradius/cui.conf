# -*- text -*-
#
#  Write Chargeable-User-Identity to the database.
#  Configured for MySQL (Salfanet)
#
sql cuisql {
    driver = "rlm_sql_mysql"
    dialect = "mysql"

    # Connection info
    server = "localhost"
    port = 3306
    login = "salfanet_user"
    # SECURITY: this is the installer's fallback default (frontend/vps-install/common.sh
    # DB_PASSWORD), not a per-deployment secret. Set DB_PASSWORD before running the
    # installer so a real random password ends up here instead of the shipped default.
    password = "salfanetradius123"
    radius_db = "salfanet_radius"

    # Table name
    cui_table = "cui"

    # SQL queries
    $INCLUDE ${modconfdir}/sql/cui/mysql/queries.conf
}
