# Nginx Configuration — Salfanet Radius (NestJS Migration)
#
# This config routes:
#   /api/v1/*  → NestJS backend (port 3001)
#   /api/*     → Next.js frontend (port 3000) — legacy routes during migration
#   /          → Next.js frontend (port 3000)
#
# Deploy:
#   sudo cp deploy/nginx-salfanet.conf /etc/nginx/sites-available/salfanet
#   sudo ln -s /etc/nginx/sites-available/salfanet /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx

server {
    listen 80;
    server_name _; # Replace with your domain

    # Client body size for file uploads (tickets, etc.)
    client_max_body_size 50M;

    # ─────────────────────────────────────────────────────────────────────
    # NestJS Backend API (/api/v1/*)
    # ─────────────────────────────────────────────────────────────────────
    location /api/v1/ {
        proxy_pass http://127.0.0.1:3001;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
        proxy_read_timeout 300s; # Long operations (PDF gen, MikroTik sync)
        proxy_send_timeout 300s;
    }

    # ─────────────────────────────────────────────────────────────────────
    # Swagger API Docs (/api/docs)
    # ─────────────────────────────────────────────────────────────────────
    location /api/docs {
        proxy_pass http://127.0.0.1:3001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # ─────────────────────────────────────────────────────────────────────
    # Legacy Next.js API routes (/api/* — kept during migration)
    # ─────────────────────────────────────────────────────────────────────
    location /api/ {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
        proxy_read_timeout 120s;
    }

    # ─────────────────────────────────────────────────────────────────────
    # Next.js Frontend (all other routes)
    # ─────────────────────────────────────────────────────────────────────
    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
        proxy_read_timeout 60s;
    }

    # Static file caching
    location /_next/static/ {
        proxy_pass http://127.0.0.1:3000;
        proxy_cache_bypass $http_upgrade;
        expires 365d;
        add_header Cache-Control "public, immutable";
    }

    # PWA assets
    location /manifest {
        proxy_pass http://127.0.0.1:3000;
        expires 1h;
    }

    location /sw.js {
        proxy_pass http://127.0.0.1:3000;
        expires 1h;
        add_header Cache-Control "no-cache";
    }

    # WebSocket support for SSE/realtime
    location /api/v1/sse {
        proxy_pass http://127.0.0.1:3001;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_buffering off; # Important for SSE
        proxy_cache off;
        proxy_read_timeout 86400s; # 24h for long-lived SSE
    }
}
