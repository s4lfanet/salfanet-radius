# Nginx Configuration — Salfanet Radius (Two Next.js Apps)
#
# This config routes:
#   /api/auth/*  → Next.js frontend (port 3000) — NextAuth routes
#   /api/*       → Next.js backend  (port 3001) — API routes + Prisma
#   /            → Next.js frontend (port 3000) — UI pages
#
# Deploy:
#   sudo cp deploy/nginx-salfanet.conf /etc/nginx/sites-available/salfanet
#   sudo ln -sf /etc/nginx/sites-available/salfanet /etc/nginx/sites-enabled/salfanet
#   sudo rm -f /etc/nginx/sites-enabled/default
#   sudo nginx -t && sudo systemctl reload nginx

server {
    listen 80;
    server_name _;
    client_max_body_size 50M;

    # ─────────────────────────────────────────────────────────────────────
    # NextAuth routes → frontend (port 3000)
    # ─────────────────────────────────────────────────────────────────────
    location /api/auth/ {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header CF-Connecting-IP $http_cf_connecting_ip;
        add_header Cache-Control 'no-store, no-cache, must-revalidate' always;
    }

    # ─────────────────────────────────────────────────────────────────────
    # API routes → backend (port 3001)
    # ─────────────────────────────────────────────────────────────────────
    location /api/ {
        proxy_pass http://127.0.0.1:3001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header CF-Connecting-IP $http_cf_connecting_ip;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
        add_header Cache-Control 'no-store, no-cache, must-revalidate' always;
    }

    # ─────────────────────────────────────────────────────────────────────
    # Everything else → frontend (port 3000)
    # ─────────────────────────────────────────────────────────────────────
    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header CF-Connecting-IP $http_cf_connecting_ip;
        proxy_cache_bypass $http_upgrade;
        add_header Cache-Control 'no-cache, must-revalidate' always;
    }
}
