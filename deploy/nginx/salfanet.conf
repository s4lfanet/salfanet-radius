server {
    listen 8080;
    server_name _;
    client_max_body_size 50M;

    # NextAuth routes → frontend (port 3000)
    location /api/auth/ {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header CF-Connecting-IP $http_cf_connecting_ip;
        add_header Cache-Control 'no-store, no-cache, must-revalidate' always;
    }

    # API routes → backend (port 3001)
    location /api/ {
        proxy_pass http://127.0.0.1:3001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header CF-Connecting-IP $http_cf_connecting_ip;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
        add_header Cache-Control 'no-store, no-cache, must-revalidate' always;
    }

    # Uploaded files → serve directly from filesystem (no Next.js)
    location /uploads/ {
        alias /var/data/salfanet/uploads/;
        access_log off;
        try_files $uri =404;

        # Only allow image file extensions
        location ~* \.(jpg|jpeg|png|webp|svg)$ {
            expires 1y;
            add_header Cache-Control 'public, max-age=31536000, immutable' always;
        }
        # Reject non-image files
        location ~* \.(php|js|html|htm|exe|sh|css)$ {
            deny all;
        }
    }

    # Everything else → frontend (port 3000)
    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header CF-Connecting-IP $http_cf_connecting_ip;
        proxy_cache_bypass $http_upgrade;
        add_header Cache-Control 'no-cache, must-revalidate' always;
    }
}
