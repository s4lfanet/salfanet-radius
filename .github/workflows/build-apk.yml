name: Build Native APKs

on:
  push:
    tags: ["apk-v*"]
  workflow_dispatch:
    inputs:
      server_url:
        description: 'API base URL baked into the APKs'
        required: true
        default: 'https://radius.salfa.my.id'
      release:
        description: 'Publish APKs to the "apk-latest" GitHub Release'
        type: boolean
        default: true

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - app_dir: mobile/admin_app
            artifact: salfanet-admin
          - app_dir: mobile/customer_app
            artifact: salfanet-customer
          - app_dir: mobile/collector_app
            artifact: salfanet-collector

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Prepare release keystore
        run: |
          if [ -n "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" ]; then
            echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 -d > "${{ matrix.app_dir }}/android/release.keystore"
            printf 'storeFile=../release.keystore\nstorePassword=%s\nkeyAlias=%s\nkeyPassword=%s\n' \
              "${{ secrets.KEYSTORE_PASSWORD }}" "${{ secrets.KEY_ALIAS }}" "${{ secrets.KEY_PASSWORD }}" \
              > "${{ matrix.app_dir }}/android/key.properties"
            echo "Release signing enabled"
          else
            echo "No keystore secrets — debug signing fallback"
          fi

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Pub get
        working-directory: ${{ matrix.app_dir }}
        run: flutter pub get

      - name: Build release APK
        working-directory: ${{ matrix.app_dir }}
        run: flutter build apk --release --split-per-abi --android-skip-build-dependency-validation --dart-define=API_BASE_URL=${{ inputs.server_url || 'https://radius.salfa.my.id' }}

      - name: Rename APK
        run: |
          for abi in armeabi-v7a arm64-v8a x86_64; do
            cp "${{ matrix.app_dir }}/build/app/outputs/flutter-apk/app-$abi-release.apk" "${{ matrix.artifact }}-$abi.apk"
          done

      # Read by the server's GitHub update source (Download APK page): the
      # version from pubspec and each ABI's file. flutter's --split-per-abi
      # adds 1000 x the ABI index to the version code (v7a 1, arm64 2, x86_64 4).
      - name: Write update manifest
        env:
          APP_DIR: ${{ matrix.app_dir }}
          ARTIFACT: ${{ matrix.artifact }}
        run: |
          export APP_VERSION="$(grep -m1 '^version:' "$APP_DIR/pubspec.yaml" | sed 's/^version: *//' | tr -d '[:space:]')"
          node -e '
            const fs = require("fs");
            const [name, build] = process.env.APP_VERSION.split("+");
            const offsets = { "armeabi-v7a": 1000, "arm64-v8a": 2000, "x86_64": 4000 };
            const files = {};
            for (const [abi, off] of Object.entries(offsets)) {
              const file = process.env.ARTIFACT + "-" + abi + ".apk";
              files[abi] = { name: file, size: fs.statSync(file).size, versionCode: Number(build) + off };
            }
            fs.writeFileSync(process.env.ARTIFACT + "-manifest.json", JSON.stringify({ versionName: name, builtAt: new Date().toISOString(), files }, null, 2));
          '
          cat "$ARTIFACT-manifest.json"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: |
            ${{ matrix.artifact }}-*.apk
            ${{ matrix.artifact }}-manifest.json
          retention-days: 90

      - name: Publish to apk-latest release
        if: ${{ github.event_name == 'push' || inputs.release }}
        uses: softprops/action-gh-release@v2
        with:
          tag_name: apk-latest
          name: APK Builds
          files: |
            ${{ matrix.artifact }}-*.apk
            ${{ matrix.artifact }}-manifest.json
          prerelease: true
